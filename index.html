<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Calculator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <header>
      <div class="icon">📅</div>
      <h1>Age Calculator</h1>
      <p>Find your exact age, total months, total days, and next birthday.</p>
    </header>

    <section class="input-card">
      <div class="field">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob">
      </div>
      <button id="calculateBtn">Calculate Age</button>
      <button id="resetBtn" class="reset">Reset</button>
    </section>

    <section id="result" class="result hidden">
      <h2>🎉 Your Age Is</h2>

      <div class="age-grid">
        <div class="age-box years"><span>🎂</span><strong id="years">0</strong><small>Years</small></div>
        <div class="age-box months"><span>📅</span><strong id="months">0</strong><small>Months</small></div>
        <div class="age-box days"><span>🗓️</span><strong id="days">0</strong><small>Days</small></div>
      </div>

      <div class="extra-grid">
        <div class="extra-box purple">
          <span>◷</span><div><b>Total Months</b><strong id="totalMonths">0</strong><small>Months</small></div>
        </div>
        <div class="extra-box orange">
          <span>▣</span><div><b>Total Days</b><strong id="totalDays">0</strong><small>Days</small></div>
        </div>
        <div class="extra-box pink">
          <span>🎁</span><div><b>Next Birthday</b><strong id="birthdayDays">0</strong><small>Days Left</small><em id="birthdayDate"></em></div>
        </div>
      </div>

      <div class="info" id="info"></div>
    </section>

    <p id="error" class="error"></p>
    <footer>CREATED BY ER. KANHAIYA KR</footer>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
